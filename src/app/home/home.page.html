<ion-header>
  <ion-toolbar class="cricket-toolbar home-app-toolbar">
    <ion-buttons slot="start">
      <div class="home-brand">
        <div class="brand-badge">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
        <span>ScoreHub</span>
      </div>
    </ion-buttons>
    <ion-buttons slot="end">
      <div class="home-user">
        <ion-avatar>
          <img *ngIf="displayPhoto" [src]="displayPhoto" alt="Player photo">
          <ion-icon *ngIf="!displayPhoto" name="person-circle-outline"></ion-icon>
        </ion-avatar>
        <span>{{displayName}}</span>
      </div>
      <ion-button class="logout-icon" fill="clear" (click)="logout()" aria-label="Logout">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="cricket-page home-page">
  <main class="home-shell">
    <section class="brand-panel cricket-card">
      <div class="brand-meta">
        <span>Live scoring</span>
      </div>
      <h1>ScoreHub</h1>
      <div class="score-preview">
        <div>
          <span class="score-label">Today's Matches</span>
          <strong>{{loadedMatches ? loadedMatches.length : 0}}</strong>
        </div>
        <div>
          <span class="score-label">Live Now</span>
          <strong>{{liveMatches.length}}</strong>
        </div>
      </div>
    </section>

    <section class="action-panel">
      <ion-button expand="block" class="primary-action" routerLink="/create-match1">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        Create Match
      </ion-button>

      <ion-button *ngIf="liveMatches.length > 0" expand="block" class="secondary-action" [routerLink]="liveMatchRoute">
        <ion-icon slot="start" name="play-circle-outline"></ion-icon>
        {{liveMatchesButtonText}}
      </ion-button>

      <ion-button *ngIf="loadedMatches && loadedMatches.length>=1" expand="block" class="secondary-action" routerLink="/todays-matches">
        <ion-icon slot="start" name="calendar-outline"></ion-icon>
        Today's Matches
      </ion-button>

      <ion-button expand="block" class="secondary-action" routerLink="/my-profile">
        <ion-icon slot="start" name="trophy-outline"></ion-icon>
        My Profile
      </ion-button>

      <ion-button expand="block" class="secondary-action" routerLink="/players">
        <ion-icon slot="start" name="search-outline"></ion-icon>
        Find Players
      </ion-button>

      <ion-button *ngIf="canManageRoles" expand="block" class="secondary-action" routerLink="/admin/users">
        <ion-icon slot="start" name="people-circle-outline"></ion-icon>
        User Access
      </ion-button>
    </section>
  </main>
</ion-content>
